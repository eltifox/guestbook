services:
  app:
    build: .
    image: ghcr.io/eltifox/guestbook:${APP_VERSION:-latest}
    env_file: .env
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: guestbook
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d guestbook"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
